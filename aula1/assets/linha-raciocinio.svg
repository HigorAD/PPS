<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <style>
    .title { font: 700 34px Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .label { font: 700 22px Segoe UI, Arial, sans-serif; fill: #111827; }
    .text { font: 18px Segoe UI, Arial, sans-serif; fill: #374151; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    .arrow { stroke: #2563eb; stroke-width: 5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="60" y="70" class="title">Linha de raciocínio da Aula 1</text>
  <rect x="60" y="130" width="230" height="170" class="box"/>
  <text x="90" y="180" class="label">1. Dor</text>
  <text x="90" y="220" class="text">Mudanças pequenas</text>
  <text x="90" y="250" class="text">ficam caras</text>
  <rect x="350" y="130" width="230" height="170" class="box"/>
  <text x="380" y="180" class="label">2. Vocabulário</text>
  <text x="380" y="220" class="text">O que é um</text>
  <text x="380" y="250" class="text">padrão?</text>
  <rect x="640" y="130" width="230" height="170" class="box"/>
  <text x="670" y="180" class="label">3. Mapa GoF</text>
  <text x="670" y="220" class="text">Criacionais,</text>
  <text x="670" y="250" class="text">estruturais e</text>
  <text x="670" y="280" class="text">comportamentais</text>
  <rect x="930" y="130" width="230" height="170" class="box"/>
  <text x="960" y="180" class="label">4. Princípios</text>
  <text x="960" y="220" class="text">Ideias de design</text>
  <text x="960" y="250" class="text">para decidir melhor</text>
  <path d="M295 215 H340" class="arrow"/>
  <path d="M585 215 H630" class="arrow"/>
  <path d="M875 215 H920" class="arrow"/>
  <rect x="265" y="365" width="670" height="85" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" rx="18"/>
  <text x="315" y="415" class="label">Resultado: enxergar problemas de design antes de escolher padrões</text>
</svg>